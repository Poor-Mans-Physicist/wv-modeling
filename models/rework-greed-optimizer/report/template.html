<meta charset="utf-8">
<title>Wold's Vaults Build Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
<style>
/* Layout: sticky vault bar, then a ledger list beside the build panel. The build panel opens with a hero, tab cards,
   and for gear a three-column bench (gear cards | floating item on a pedestal | curios). One committed dark look. */
:root {
  color-scheme: dark;
  --bg: #060608;
  --bg-glow: #120f1c;
  --s1: #0d0d12;
  --s2: #13131a;
  --s3: #1b1a24;
  --line: rgba(255, 255, 255, 0.07);
  --line-2: rgba(255, 255, 255, 0.12);
  --ink: #f2f1f6;
  --ink-2: #b9b8c6;
  --muted: #7d7c8c;
  --gold: #ffaa00;
  --gold-2: #ffcf6a;
  --gold-dim: rgba(255, 170, 0, 0.35);
  --violet: #9b7bff;
  --violet-dim: rgba(155, 123, 255, 0.28);
  --red: #f87171;
  --rose: #fb5c7c;
  --green: #4ade80;
  --teal: #2dd4bf;
  --blue: #60a5fa;
  --cyan: #67e8f9;
  --omega: #4ade80;
  --mythic: #fb5c7c;
  --font: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--bg); }
body {
  margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.45;
  background-image: radial-gradient(1200px 600px at 70% -10%, var(--bg-glow), transparent 70%), radial-gradient(900px 500px at -10% 30%, rgba(255,170,0,0.035), transparent 70%);
  background-attachment: fixed; font-variant-numeric: tabular-nums;
}
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
img.px, .px img { image-rendering: pixelated; }

/* top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: rgba(6, 6, 8, 0.82); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.bar-in { max-width: 1680px; margin: 0 auto; padding: 10px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; min-width: 0; }
.mark { width: 30px; height: 30px; flex: none; }
.brand b { display: block; font-weight: 900; font-size: 1.08rem; letter-spacing: -0.01em; background: linear-gradient(180deg, #ffe3a0, var(--gold)); -webkit-background-clip: text; background-clip: text; color: transparent; white-space: nowrap; }
.brand small { display: block; color: var(--muted); font-size: 0.72rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seg { display: inline-flex; padding: 3px; gap: 2px; background: var(--s1); border: 1px solid var(--line); border-radius: 10px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; color: var(--ink-2); padding: 6px 11px; border-radius: 7px; font-weight: 600; font-size: 0.82rem; cursor: pointer; }
.seg button:hover { color: var(--ink); background: var(--s2); }
.seg button[aria-pressed="true"] { background: var(--s3); color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold-dim); }

.wrap { max-width: 1680px; margin: 0 auto; padding-inline: 16px; padding-block: 18px 48px; display: flex; flex-direction: column; gap: 16px; }

/* panels with vault-door corner ornaments */
.panel { position: relative; background: linear-gradient(180deg, rgba(255,255,255,0.025), rgba(255,255,255,0.01)), var(--s1); border: 1px solid var(--line); border-radius: 16px; }
.orn::before, .orn::after { content: ""; position: absolute; width: 14px; height: 14px; border: 1.5px solid var(--gold-dim); pointer-events: none; }
.orn::before { left: 8px; top: 8px; border-right: 0; border-bottom: 0; border-top-left-radius: 6px; }
.orn::after { right: 8px; bottom: 8px; border-left: 0; border-top: 0; border-bottom-right-radius: 6px; }
.eyebrow { font-size: 0.68rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); }
.rule { display: flex; align-items: center; gap: 10px; color: var(--gold-dim); }
.rule::before, .rule::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--gold-dim), transparent); }
.rule i { width: 6px; height: 6px; transform: rotate(45deg); background: var(--gold); opacity: 0.7; }

/* layout */
.layout { display: grid; grid-template-columns: minmax(300px, 370px) minmax(0, 1fr); gap: 16px; align-items: start; }
.backbtn { display: none; }
@media (max-width: 1080px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .layout:not(.detail) .main { display: none; }
  .layout.detail .side { display: none; }
  .backbtn { display: inline-flex; }
}

/* ledger list */
.side { padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; position: sticky; top: 72px; }
@media (max-width: 1080px) { .side { position: static; } }
.side h3 { margin: 0; font-size: 0.95rem; font-weight: 800; }
.side .hint { margin: 0; color: var(--muted); font-size: 0.75rem; }
.filters { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.filters .full { grid-column: 1 / -1; }
.sel, .inp { width: 100%; min-width: 0; background: var(--s2); border: 1px solid var(--line); border-radius: 9px; padding: 7px 9px; font-size: 0.8rem; color: var(--ink); }
.sel option { background: var(--s2); }
.rows { display: flex; flex-direction: column; gap: 6px; max-height: calc(100vh - 290px); overflow: auto; padding-right: 2px; }
@media (max-width: 1080px) { .rows { max-height: none; overflow: visible; } }
.row { display: grid; grid-template-columns: 42px minmax(0, 1fr) auto; gap: 10px; align-items: center; width: 100%; text-align: left; padding: 8px 10px; background: var(--s2); border: 1px solid var(--line); border-radius: 12px; cursor: pointer; color: var(--ink); }
.row:hover { border-color: var(--line-2); background: var(--s3); }
.row[aria-current="true"] { border-color: var(--gold-dim); background: linear-gradient(90deg, rgba(255,170,0,0.08), transparent 60%), var(--s3); }
.row .nm { display: block; font-weight: 700; font-size: 0.88rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; }
.row .cyc { font-weight: 900; font-size: 1.25rem; color: var(--gold); text-align: right; min-width: 3.2ch; }
.row .cyc small { display: block; font-size: 0.6rem; font-weight: 600; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
.mini { display: block; position: relative; height: 4px; border-radius: 3px; background: rgba(255,255,255,0.06); margin-top: 6px; overflow: hidden; }
.mini i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; }
.chip { font-size: 0.66rem; font-weight: 600; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line-2); color: var(--ink-2); white-space: nowrap; }
.chip.st { color: #fde68a; border-color: rgba(253,230,138,0.3); } .chip.cc { color: var(--green); border-color: rgba(74,222,128,0.3); } .chip.hy { color: #c4b5fd; border-color: rgba(196,181,253,0.3); }
.chip.bug { color: #fbbf24; border-color: rgba(251,191,36,0.45); background: rgba(251,191,36,0.08); } .chip.ex { color: var(--red); border-color: rgba(248,113,113,0.35); }
.chip.gm { color: #f0abfc; border-color: rgba(240,171,252,0.35); } .chip.rare { color: var(--gold-2); border-color: var(--gold-dim); }

/* icon frames */
.frame { position: relative; display: grid; place-items: center; width: 42px; height: 42px; border-radius: 10px; background: rgba(0,0,0,0.45); border: 2px solid var(--c, var(--line-2)); box-shadow: 0 0 10px -2px var(--c, transparent); flex: none; }
.frame img { width: 30px; height: 30px; image-rendering: pixelated; }
.frame .lv { position: absolute; right: -6px; bottom: -7px; font-size: 0.62rem; font-weight: 800; padding: 0 5px; border-radius: 6px; background: var(--c, #333); color: #0b0b0f; }

/* build hero */
.main { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.hero { padding: 20px 22px 18px; display: flex; flex-direction: column; gap: 14px; overflow: hidden; }
.hero::selection { background: var(--gold-dim); }
.hero-top { display: flex; flex-wrap: wrap; gap: 14px 18px; align-items: center; }
.hero-top .frame { width: 64px; height: 64px; border-radius: 14px; }
.hero-top .frame img { width: 46px; height: 46px; }
.hero h1 { margin: 2px 0 0; font-size: clamp(1.6rem, 3vw, 2.25rem); font-weight: 900; letter-spacing: -0.02em; line-height: 1.05; text-wrap: balance; }
.hero .meta { color: var(--ink-2); font-size: 0.85rem; margin-top: 4px; }
.hero-actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-2); background: var(--s2); color: var(--ink); padding: 7px 12px; border-radius: 10px; font-weight: 600; font-size: 0.8rem; cursor: pointer; }
.btn:hover { border-color: var(--gold-dim); color: var(--gold-2); }
.btn.gold { background: linear-gradient(180deg, #ffbf3a, var(--gold)); color: #1a1100; border-color: transparent; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
.kpi { background: var(--s2); border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px; min-width: 0; }
.kpi span { display: block; font-size: 0.62rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.kpi b { display: block; font-size: 1.45rem; font-weight: 900; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.callouts { display: flex; flex-direction: column; gap: 8px; }
.callout { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 2px 10px; padding: 11px 13px; border-radius: 12px; border: 1px solid rgba(251,191,36,0.35); background: linear-gradient(90deg, rgba(251,191,36,0.10), rgba(251,191,36,0.02) 60%); }
.callout.neg { border-color: rgba(96,165,250,0.3); background: linear-gradient(90deg, rgba(96,165,250,0.08), transparent 60%); }
.callout svg { width: 22px; height: 22px; grid-row: span 2; margin-top: 1px; }
.callout .t { font-weight: 700; font-size: 0.9rem; }
.callout .t em { font-style: normal; font-weight: 800; color: #fbbf24; margin-right: 6px; }
.callout.neg .t em { color: var(--blue); }
.callout .d { color: var(--ink-2); font-size: 0.8rem; line-height: 1.5; }
.callout .d b { color: var(--ink); font-weight: 600; }

/* tab cards */
.tabs { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 760px) { .tabs { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.tab { display: flex; align-items: center; gap: 10px; text-align: left; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--s1); cursor: pointer; color: var(--ink); min-width: 0; }
.tab:hover { border-color: var(--line-2); }
.tab[aria-selected="true"] { background: var(--s3); border-color: var(--gold-dim); }
.tab svg { width: 30px; height: 30px; flex: none; padding: 6px; border-radius: 8px; background: var(--s2); border: 1px solid var(--line); color: var(--ink-2); }
.tab[aria-selected="true"] svg { color: var(--gold); border-color: var(--gold-dim); }
.tab b { display: block; font-size: 0.85rem; font-weight: 700; }
.tab small { display: block; color: var(--muted); font-size: 0.7rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tabbody { padding: 18px; min-height: 420px; }
.sec { margin: 0 0 10px; font-size: 0.95rem; font-weight: 800; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.sec small { color: var(--muted); font-weight: 500; font-size: 0.78rem; }
.empty-note { color: var(--muted); font-style: italic; }
.nbar { display: inline-block; width: 46px; height: 6px; margin-right: 6px; vertical-align: middle; border-radius: 3px; background: var(--s3); overflow: hidden; }
.nbar i { display: block; height: 100%; background: var(--gold); }
.xpbar { display: flex; height: 10px; margin-top: 3px; border-radius: 5px; overflow: hidden; background: var(--s3); }
.xpbar i { display: block; height: 100%; }
table.nodes tr.nrow { cursor: pointer; }
table.nodes tr.nrow:hover td, table.nodes tr.nrow[aria-expanded="true"] td { background: rgba(255,255,255,0.03); }
table.nodes tr.ndet td { background: rgba(255,255,255,0.02); }
.ndetin { max-width: 980px; font-size: 0.84rem; line-height: 1.5; }
.ndetin p { margin: 0 0 8px; }
table.nodes .muted, .ndetin .muted { color: var(--muted); }
.gsplit { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 14px; align-items: start; }
@media (max-width: 760px) { .gsplit { grid-template-columns: minmax(0, 1fr); } }
.ucgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; align-items: start; }
.ucgrid .card-tt { max-width: none; }
.card-tt.locked { opacity: 0.55; }
.card-tt .tn .chip { margin-left: 4px; vertical-align: 2px; }
.erg { font-size: 0.76rem; color: var(--muted); line-height: 1.6; }
.erg .on { color: var(--gold-2); font-weight: 700; }
.famlist { display: flex; flex-wrap: wrap; gap: 4px; }
button.chip.fam { background: transparent; cursor: pointer; font-family: inherit; }
button.chip.fam:hover { color: var(--gold); border-color: var(--gold-dim); }

/* gear bench */
.bench { position: relative; display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr) minmax(0, 300px); gap: 22px; align-items: start; }
@media (max-width: 1320px) { .bench { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .stage { grid-column: 1 / -1; order: -1; } }
@media (max-width: 620px) { .bench { grid-template-columns: minmax(0, 1fr); } }
.wires { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
@media (max-width: 1320px) { .wires { display: none; } }
.gcol { display: flex; flex-direction: column; gap: 8px; position: relative; z-index: 1; min-width: 0; }
.gcard { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 8px 10px; border-radius: 12px; border: 1px solid var(--line); background: rgba(0,0,0,0.35); cursor: pointer; color: var(--ink); min-width: 0; }
.gcard:hover { border-color: var(--line-2); background: rgba(255,255,255,0.03); }
.gcard[aria-pressed="true"] { border-color: var(--c, var(--gold-dim)); box-shadow: 0 0 0 1px var(--c, var(--gold-dim)) inset; }
.gcard .frame { width: 48px; height: 48px; }
.gcard .gt { min-width: 0; }
.gcard .gl { display: block; font-size: 0.62rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.gcard .gn { display: block; font-weight: 700; font-size: 0.88rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gcard .gs { display: block; font-size: 0.72rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gcard.dim { opacity: 0.5; }
.stage { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 12px; min-width: 0; }
.pedestal { position: relative; width: min(100%, 300px); aspect-ratio: 1 / 1; display: grid; place-items: center; max-width: 100%; }
.pedestal::before { content: ""; position: absolute; inset: 6%; border-radius: 50%; background: radial-gradient(circle, rgba(155,123,255,0.22), rgba(255,170,0,0.06) 45%, transparent 68%); }
.pedestal::after { content: ""; position: absolute; inset: 2%; border-radius: 50%; border: 1px dashed rgba(255,170,0,0.18); box-shadow: inset 0 0 0 14px rgba(255,255,255,0.012), inset 0 0 0 15px rgba(255,170,0,0.08); }
.pedestal .base { position: absolute; bottom: 8%; width: 46%; height: 9%; border-radius: 50%; background: radial-gradient(ellipse, rgba(0,0,0,0.75), transparent 70%); }
.float { position: relative; animation: bob 4s ease-in-out infinite; }
@keyframes bob { 0%, 100% { transform: translateY(-4px); } 50% { transform: translateY(6px); } }
.m3 { position: relative; }
.m3-spinner, .m3-scene, .m3-grp { position: absolute; left: 50%; top: 50%; transform-style: preserve-3d; }
.m3-face { position: absolute; left: 0; top: 0; transform-style: preserve-3d; backface-visibility: hidden; }
.m3-tex { position: absolute; image-rendering: pixelated; backface-visibility: hidden; }
.m3-layer { position: absolute; left: 0; top: 0; image-rendering: pixelated; backface-visibility: visible; }
.m3-spin .m3-spinner { animation: spin 9s linear infinite; }
.m3-sway .m3-spinner { animation: sway 6s ease-in-out infinite alternate; }
@keyframes sway { from { transform: rotateY(-38deg) rotateX(8deg); } to { transform: rotateY(38deg) rotateX(8deg); } }
@keyframes spin { from { transform: rotateY(0deg); } to { transform: rotateY(360deg); } }
@media (prefers-reduced-motion: reduce) { .float, .m3-spin .m3-spinner { animation: none; } }
.card-tt { width: 100%; max-width: 440px; background: rgba(8,8,11,0.92); border: 1px solid var(--line-2); border-radius: 14px; padding: 13px 15px; }
.card-tt .tn { font-size: 1.05rem; font-weight: 800; }
.card-tt .tr { font-size: 0.78rem; color: var(--muted); margin: 2px 0 8px; }
.card-tt .tr b { color: var(--ink-2); font-weight: 600; }
.card-tt .th { font-size: 0.66rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--green); margin: 8px 0 2px; }
.card-tt .al { font-size: 0.86rem; font-weight: 500; }
.card-tt .rg { color: var(--muted); font-size: 0.74rem; font-weight: 400; }
.card-tt .tx { color: var(--ink-2); font-size: 0.8rem; margin-top: 8px; line-height: 1.5; }
.deckgrid { display: grid; gap: 3px; justify-content: center; margin: 4px 0 8px; }
.dc { width: 36px; height: 36px; position: relative; border-radius: 6px; background: #1a1922; border: 1px solid rgba(255,255,255,0.05); cursor: default; }
.dc img { position: absolute; left: 1px; top: 1px; width: 32px; height: 32px; image-rendering: pixelated; }
.dc img.ic { left: 8px; top: 6px; width: 18px; height: 18px; }
.dc .ar { position: absolute; inset: 0; display: grid; place-items: center; font-size: 0.95rem; color: var(--gold-2); text-shadow: 0 1px 2px #000; }
.dc .nv { position: absolute; left: 0; right: 0; bottom: -1px; text-align: center; font-size: 0.56rem; font-weight: 700; color: #fff; text-shadow: 0 0 3px #000, 0 0 2px #000; }
.dc.dead { background: #0a0a0d; }
.dc:hover, .dc[aria-pressed="true"] { outline: 1px solid var(--gold); }
.dfoot { min-height: 3.8em; font-size: 0.78rem; color: var(--ink-2); }
.dfoot.fixed { height: 9.2em; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding-right: 4px; }
.dc.dlx { box-shadow: inset 0 0 0 1px rgba(250, 204, 21, 0.55); }
.dc .lv { position: absolute; right: 1px; top: 0; font-size: 0.55rem; font-weight: 800; color: var(--gold-2); text-shadow: 0 0 3px #000, 0 0 2px #000; }
.dchips { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0 6px; }
.dchip { font-size: 0.72rem; font-weight: 700; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line-2); color: var(--ink-2); white-space: nowrap; }
.dchip.m { border-color: rgba(244, 114, 182, 0.55); color: #f9a8d4; }
.dchip.a { border-color: rgba(52, 211, 153, 0.5); color: #6ee7b7; }
.dbd { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 1px 10px; font-size: 0.74rem; margin-top: 3px; }
.dbd .k { color: var(--muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dbd .v { color: var(--ink-2); font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
.dcmp { width: 100%; border-collapse: collapse; font-size: 0.76rem; margin-top: 4px; table-layout: fixed; }
.dcmp td { padding: 2px 4px; border-top: 1px solid var(--line); }
.dcmp td:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dcmp td.n { width: 4.2em; text-align: right; font-variant-numeric: tabular-nums; }
.dcmp tr.cur td { color: var(--gold-2); font-weight: 700; }
.dmenu { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
.dmenu .card-tt { max-width: none; min-width: 0; }
.dmenu .card-tt .tn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dstat { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin: 6px 0; }
.dstat div { background: var(--s2); border: 1px solid var(--line); border-radius: 10px; padding: 5px 8px; min-width: 0; }
.dstat b { display: block; font-size: 0.95rem; font-variant-numeric: tabular-nums; }
.dstat small { color: var(--muted); font-size: 0.68rem; letter-spacing: 0.06em; text-transform: uppercase; }

/* stats */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; margin-top: 18px; align-items: start; }
html { scrollbar-gutter: stable; }
.sgroup { background: var(--s2); border: 1px solid var(--line); border-radius: 14px; padding: 12px 12px 8px; min-width: 0; }
.sgroup h4 { margin: 0 0 6px; font-size: 0.68rem; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; }

/* ---------- floating tooltip (trees, deck cards) ---------- */
const tip = $("#tip");

  if (left + r.width > innerWidth - 8) left = Math.max(8, x - r.width - 16);
  if (top + r.height > innerHeight - 8) top = Math.max(8, innerHeight - r.height - 8);
  tip.style.left = left + "px"; tip.style.top = top + "px";
}
function showTipAt(html, x, y, pin) {

}
function hideTip(force) { if (tipPinned && !force) return; tip.style.display = "none"; tipPinned = false; tip.classList.remove("pinned"); }

document.addEventListener("keydown", e => { if (e.key === "Escape") hideTip(true); });

  el.addEventListener("mousemove", e => { if (!tipPinned) placeTip(e.clientX, e.clientY); });

    e.stopPropagation();

}

const SORTS = {

  dps: ["Boss DPS", b => b.dps], pack: ["Pack DPS", b => b.pack_dps], ehp: ["Effective HP", b => (b.survival && b.survival.ehp_god) || b.ehp], bug: ["Bug dependence", b => bugGain(b)],

function ledgerList() {
  let list = BUILDS.filter(b => b.stage === S.stage && b.mode === S.mode);
  if (S.role !== "all") list = list.filter(b => b.class === S.role);
  if (S.scale !== "all") list = list.filter(b => scaleTag(b) === S.scale);
  if (S.eot === "no") list = list.filter(b => b.variant !== "eot");

  if (S.q) { const q = S.q.toLowerCase(); list = list.filter(b => famLabel(b).toLowerCase().includes(q) || b.family.toLowerCase().includes(q)); }
  if (S.group === "skill") {

    for (const b of list) {
      const k = b.kind === "melee" ? "melee" : specSkill(b.main_spec);
      if (!best[k] || b.cycle > best[k].cycle) best[k] = b;

  const f = (SORTS[S.sort] || SORTS.cycle)[1];

const KIND = {row: "Row", col: "Column", surr: "Surrounding", diag: "Diagonal", deluxe: "Deluxe", typeless: "Typeless"};
const SLOT_LABEL = {helmet: "Helmet", chestplate: "Chestplate", leggings: "Leggings", boots: "Boots", mainhand: "Main hand", offhand: "Offhand", necklace: "Necklace"};
function itemName(it) {

function itemColor(it) { return it.legendary ? "var(--gold)" : (RARITY[it.rarity] || [0, "var(--ink)"])[1]; }

function powerLine(p) {

function itemCard(b, slot, it) {

    <div class="tr"><b>${it.type === "vault_necklace" ? "Scrappy" : human(it.rarity)}</b> · ${esc(SLOT_LABEL[slot] || slot)} · Lv. 100${it.legendary ? " · legendary affix (+2 tiers)" : ""}${it.unique ? ` · ${esc(human(it.type))}, fixed affixes` : ""}</div>`;

  const st = S.gstage, eot = S.gvar === "eot";

      <td class="num">${useBar(r.users.length / n)}<small style="display:block;color:var(--muted)">${r.users.length} of ${n}</small></td>

      <td>${(r.u.powers || []).map(p => `<div style="font-size:.78rem">${esc(p.label)}${p.modeled ? "" : ` <span class="muted">(not counted)</span>`}</div>`).join("") || `<span class="muted">stats only</span>`}</td></tr>
    <tr class="ndet" hidden><td colspan="4"><div class="gsplit">${uniqueCard(r.u.id, st)}<div class="ndetin"><p style="margin-bottom:4px"><b>Worn by</b> <span class="muted">(rank at this stage; click to open)</span></p><div class="famlist">${r.users.map(famBtn).join(" ")}</div></div></div></td></tr>`).join("");
  let bench = "";
  const SB = UB && UB.stages[st];
  if (eot) bench = `<p class="muted" style="font-size:.82rem">The unique bench covers the standard builds only; switch to Standard to see it.</p>`;
  else if (!SB) bench = `<p class="muted" style="font-size:.82rem">No unique bench for this stage.</p>`;
  else {
    const BB = SB.builds, ids = Object.keys(SB.status);
    const byFam = Object.fromEntries(all.map(b => [b.family, b]));
    const row = id => {
      const info = UB.uniques[id] || {name: id, skills: [], slot: "?"};
      const blocked = SB.status[id] === "blocked";
      const res = Object.entries(BB).map(([f, e]) => ({f, b: byFam[f], e: e.uniques[id], g: benchGain(e.uniques[id]), noise: e.noise})).filter(x => x.b);
      const match = res.filter(x => info.skills.length && info.skills.includes(x.b.kind === "melee" ? "" : specSkill(x.b.main_spec)));
      const ok = res.filter(x => x.g !== null).sort((a, b) => b.g - a.g);
      const helps = ok.filter(x => x.g > Math.max(0.1, x.noise || 0));
      const bestX = ok[0];
      const fails = res.filter(x => x.e && x.e.failed);
      const matchCell = blocked ? `<span class="muted">-</span>` : match.length ? match.map(x => `<div>${famBtn(x.b)} ${gainCell(x.g, x.noise)}${x.e && x.e.failed ? ` <span class="muted">${esc(FAIL_TEXT[x.e.failed] || x.e.failed)}</span>` : ""}</div>`).join("") : `<span class="muted">${info.specific ? "no build uses this skill as its main hit" : "general unique"}</span>`;
      const det = blocked ? `<p class="muted">Not benched: no build could fit it.</p>`
        : `<div class="tablewrap"><table class="t"><thead><tr><th>Build</th><th>Cycle</th><th>With this unique</th><th>Gain</th><th>Noise</th></tr></thead><tbody>${res.sort((a, b) => (b.g ?? -99) - (a.g ?? -99)).map(x => `<tr><td>${famBtn(x.b)}</td><td class="num">${cyc(x.b.cycle)}</td><td class="num">${x.e && !x.e.failed ? cyc(x.e.cycle) + (x.e.met ? "" : " *") : `<span class="muted">${esc(x.e ? FAIL_TEXT[x.e.failed] || x.e.failed : "not run")}</span>`}</td><td class="num">${gainCell(x.g, x.noise)}</td><td class="num muted">${x.noise != null ? "±" + x.noise.toFixed(2) : "-"}</td></tr>`).join("")}</tbody></table></div>`;
      return `<tr class="nrow" tabindex="0" aria-expanded="false"><td><span style="color:${info.ancient ? "#ff9b3d" : "var(--gold-2)"};font-weight:700">${esc(info.name)}</span><small style="display:block;color:var(--muted)">${esc(SLOT_LABEL[info.slot] || info.slot)}${info.skills.length ? " · " + info.skills.map(s => esc(s.replace(/_/g, " "))).join(", ") : ""}</small></td>
        <td>${matchCell}</td>
        <td>${blocked ? `<span class="muted">locked slot</span>` : bestX ? `${famBtn(bestX.b)} ${gainCell(bestX.g, bestX.noise)}` : `<span class="muted">-</span>`}</td>
        <td class="num">${blocked ? "-" : `${helps.length} of ${ok.length}`}${fails.length && !blocked ? `<small style="display:block;color:var(--muted)">${fails.length} cannot wear it</small>` : ""}</td>

    const spec = ids.filter(id => (UB.uniques[id] || {}).specific).sort((a, b) => UB.uniques[a].name.localeCompare(UB.uniques[b].name));
    const gen = ids.filter(id => !(UB.uniques[id] || {}).specific).sort((a, b) => UB.uniques[a].name.localeCompare(UB.uniques[b].name));
    const anc = st === "end" || st === "max";
    bench = `<div><h3 class="sec">Ability-specific uniques<small>${anc ? "benched as their ancient versions" : "benched as regular uniques"}; gain in hyper cycles; click a row for every build</small></h3>${tableOf(spec)}</div>
      ${gen.length ? `<div><h3 class="sec">Every other unique<small>benched as their ancient versions at max</small></h3>${tableOf(gen)}</div>` : ""}
      <p style="font-size:.76rem;color:var(--muted);margin:0">How the bench works: each build in this stage was re-annealed from its best build with the unique locked into its slot (${num(UB.meta.iters)} steps, the phase-2 schedule). Other uniques over the unique or ancient limit come off, and when the piece goes in the offhand, Temporal Breaking is bought through a Wendarr transfer slot (or a Wendarr charm if that fails). The same build also got ${UB.meta.controls} unlocked re-anneals with the same budget. Gain is the locked result minus the best of the original build and those controls, so a negative gain means the build is better off without the unique. Noise is the spread between the controls; gains inside max(0.1, noise) are shown grey. * = the bench build misses a requirement. Bench run ${esc(UB.meta.generated)} on results ${esc(UB.meta.results_generated)}${UB.meta.results_generated !== META.generated ? ` <b style="color:#fbbf24">(the results have changed since; rerun tools/unique_bench.py)</b>` : ""}.</p>`;

/* ---------- etchings (greed rework): which etchings builds carry, and every etching in the catalogue ---------- */
const ET = UI.etchings;
const ETCH_BY_ID = ET ? Object.fromEntries(ET.list.map(e => [e.id, e])) : {};
const ETAG = {modeled: ["cc", "modeled", "Modeled"], planned: ["hy", "planned", "Planned"], "not-modeled": ["bug", "not modeled", "Not modeled"], "no-boss": ["", "nothing against the boss", "Nothing vs boss"]};
const GEAR_NAME = {HELMET: "Helmet", CHESTPLATE: "Chestplate", LEGGINGS: "Leggings", BOOTS: "Boots", SWORD: "Sword", AXE: "Axe", WAND: "Wand", FOCUS: "Focus", SHIELD: "Shield", VOID_STONE: "Void Stone"};
function etchTag(tag) {
  const t = ETAG[tag];
  if (!t) console.warn("[etchings] unknown tag", tag, "shown as not modeled");
  const [c, label] = t || ETAG["not-modeled"];
  return `<span class="chip ${c}">${label}</span>`;
}
function etchStageText(e, st) { return typeof e.text === "string" ? e.text : e.text[STAGES.indexOf(st)]; }
function etchGear(e) {
  const named = e.groups.filter(g => !GEAR_NAME[g]), gear = e.gear.map(g => esc(GEAR_NAME[g] || human(g))).join(", ");
  return named.length ? `${named.map(esc).join(", ")}: ${gear}` : gear;
}
function etchCard(e, st, extra) {
  const [gt, q] = ET.stages[st], cur = e.cur[STAGES.indexOf(st)], locked = cur === null || cur === undefined;
  const ranges = e.ranges.map(([lo, hi, t], i) => `<span${i === cur ? ' class="on"' : ""} title="greed tier ${lo}${hi === -1 ? "+" : "-" + hi}">g${lo}: ${esc(t)}</span>`).join(" · ");
  const flag = e.ranges.every(r => r[2] === "on");
  const where = locked ? (e.mgt > gt ? `Unlocks at greed tier ${e.mgt}; shown at its first bracket.` : `No bracket covers greed tier ${gt}; shown at its first bracket.`) : flag ? "" : `Rolled at ${pct(q)} of its range at greed tier ${gt}, as builds get it.`;
  return `<div class="card-tt${locked ? " locked" : ""}"><div class="tn" style="color:var(--gold-2)">${esc(e.name)}${etchTag(e.tag)}</div>
    <div class="tr"><b>Greed tier ${e.mgt}+</b> · ${etchGear(e)}</div>
    <div class="al">${esc(etchStageText(e, st))}</div>${where ? `
    <div class="tx" style="margin-top:4px">${where}</div>` : ""}
    <div class="th">Rolls by greed tier</div><div class="erg">${ranges}</div>
    <div class="tx">${esc(ETAG[e.tag] ? ETAG[e.tag][2] : "Not modeled")}: ${esc(e.note)}</div>${extra ? `<div class="tx">${extra}</div>` : ""}</div>`;
}
function renderEtchings() {
  if (!ET) { $("#main").innerHTML = `<section class="panel orn page"><p class="empty-note">This ledger has no etching catalogue.</p></section>`; return; }
  const st = S.estage, eot = S.evar === "eot", [gt, q] = ET.stages[st];
  const all = BUILDS.filter(b => b.stage === st && (b.variant === "eot") === eot).sort((a, b) => b.cycle - a.cycle);
  const n = all.length, topN = Math.max(1, Math.floor(n / 4)), top = new Set(all.slice(0, topN)), rank = new Map(all.map((b, i) => [b, i + 1]));
  const used = {};
  let none = 0;
  for (const b of all) {
    const ets = Object.entries(b.items).filter(([, it]) => it && it.etching);
    if (!ets.length) none++;
    const seen = new Set();
    for (const [slot, it] of ets) {
      const id = it.etching.id;
      const r = used[id] = used[id] || {id, name: it.etching.name, users: [], top: 0, slots: {}, uses: []};
      if (!seen.has(id)) { seen.add(id); r.users.push(b); if (top.has(b)) r.top++; }
      r.slots[slot] = (r.slots[slot] || 0) + 1;
      r.uses.push({b, slot, ef: (b.etching_effects || []).find(x => x.slot === slot && x.id === id)});
    }
  }
  const famBtn = b => `<button class="chip fam" data-k="${esc(b._key)}" title="open this build">${rank.get(b)}. ${esc(famLabel(b))}</button>`;
  const usedRows = Object.values(used).sort((a, b) => b.users.length - a.users.length || b.top - a.top).map(r => {
    const e = ETCH_BY_ID[r.id];
    if (!e) console.warn("[etchings] build etching not in the catalogue:", r.id);
    const efs = r.uses.map(u => u.ef).filter(Boolean);
    const avgC = efs.length ? efs.reduce((s, x) => s + x.cycle_delta, 0) / efs.length : null;
    const gmD = efs.length ? Math.exp(efs.reduce((s, x) => s + Math.log(Math.max(x.dps_ratio, 1e-9)), 0) / efs.length) : null;
    const worth = efs.length ? `<div>${gainCell(avgC, 0)} <span class="muted">cycles</span></div><div>${ratio(gmD)} <span class="muted">boss DPS</span></div>${efs.length < r.uses.length ? `<small style="display:block;color:var(--muted)">${efs.length} of ${r.uses.length} measured</small>` : ""}` : `<span class="muted">not measured</span>`;
    const slots = Object.entries(r.slots).sort((a, b) => b[1] - a[1]).map(([s, c]) => `<div style="font-size:.8rem">${esc(SLOT_LABEL[s] || s)} <span class="muted">${c}</span></div>`).join("");
    const det = `<div class="tablewrap"><table class="t"><thead><tr><th>Build</th><th>Slot</th><th>Cycle</th><th>Cycles it adds</th><th>Boss DPS</th><th>Pack DPS</th><th>Survival cycles</th></tr></thead><tbody>${r.uses.sort((a, b) => rank.get(a.b) - rank.get(b.b)).map(u => `<tr><td>${famBtn(u.b)}</td><td>${esc(SLOT_LABEL[u.slot] || u.slot)}</td><td class="num">${cyc(u.b.cycle)}</td>${u.ef ? `<td class="num">${gainCell(u.ef.cycle_delta, 0)}</td><td class="num">${ratio(u.ef.dps_ratio)}</td><td class="num">${ratio(u.ef.pack_ratio)}</td><td class="num">${gainCell(u.ef.survival_delta, 0)}</td>` : `<td colspan="4" class="muted">no attribution</td>`}</tr>`).join("")}</tbody></table></div>`;
    return `<tr class="nrow" tabindex="0" aria-expanded="false"><td><span style="color:var(--gold-2);font-weight:700">${esc(e ? e.name : r.name)}</span> ${e ? etchTag(e.tag) : ""}<small style="display:block;color:var(--muted)">${e ? etchGear(e) + " · greed tier " + e.mgt + "+" : "not in the etching catalogue"}</small></td>
      <td class="num">${useBar(r.users.length / n)}<small style="display:block;color:var(--muted)">${r.users.length} of ${n}</small></td>
      <td class="num">${useBar(r.top / topN)}<small style="display:block;color:var(--muted)">${r.top} of ${topN}</small></td>
      <td>${slots}</td><td>${worth}</td></tr>
      <tr class="ndet" hidden><td colspan="5"><div class="gsplit">${e ? etchCard(e, st) : `<div class="card-tt"><div class="tx">No catalogue entry for ${esc(r.id)}.</div></div>`}<div class="ndetin" style="max-width:none;min-width:0"><p style="margin-bottom:4px"><b>Carried by</b> <span class="muted">(rank at this stage; click a build to open it)</span></p>${det}</div></div></td></tr>`;
  }).join("");
  const counts = {};
  ET.list.forEach(e => { counts[e.tag] = (counts[e.tag] || 0) + 1; });
  const tags = [["all", `All ${ET.list.length}`], ...Object.keys(ETAG).filter(t => counts[t]).map(t => [t, `${ETAG[t][2]} ${counts[t]}`])];
  const cards = ET.list.map(e => `<div data-t="${esc(e.tag)}" data-n="${esc([e.name, etchStageText(e, st), e.note, ...e.groups, ...e.gear].join(" ").toLowerCase())}">${etchCard(e, st, used[e.id] ? `Carried by ${used[e.id].users.length} of ${n} builds at this stage.` : "")}</div>`).join("");
  $("#main").innerHTML = `<section class="panel orn page">
    <div><div class="eyebrow">${STAGE_LABEL[st]} stage · greed tier ${gt} · ${eot ? "Edge of Time pass" : "standard builds"} · ${n} builds${n ? `, top quartile ${cyc(all[topN - 1].cycle)}+` : ""}</div><h3 class="sec" style="font-size:1.25rem;margin:2px 0 0">Etchings</h3></div>
    <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center"><div class="seg" id="estage"></div><div class="seg" id="evar"></div></div>
    <div><h3 class="sec">Etchings used<small>${n ? `${none} of ${n} builds carry none; click a row for the builds` : ""}</small></h3>
      ${!n ? `<p class="muted">No ${eot ? "Edge of Time " : ""}builds at the ${STAGE_LABEL[st].toLowerCase()} stage${eot ? " (the Edge of Time pass starts at mid)" : ""}.</p>` : usedRows ? `<div class="tablewrap"><table class="t nodes"><thead><tr><th>Etching</th><th>All builds</th><th>Top quartile</th><th>Slots</th><th>Worth (average)</th></tr></thead><tbody>${usedRows}</tbody></table></div>
      <p style="font-size:.76rem;color:var(--muted);margin:8px 0 0">Top quartile: the best ${topN} builds at this stage by hyper cycle. Slots: the pieces it sits on, with how many builds put it there. Worth: each etching taken off on its own and the build re-scored, not re-optimized; the average is the mean hyper cycles it adds and the geometric mean of boss DPS with it over without it, across the pieces that carry it. The expanded rows give each build's numbers, pack DPS and survival cycles included.</p>` : `<p class="muted">No build carries an etching at this stage.</p>`}</div>
    <div><h3 class="sec">Every etching<small>${ET.list.length} in the catalogue; text rolled at this stage's bracket, gold in the ranges</small></h3>
      <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:10px"><input class="inp" id="etfilter" placeholder="Filter by name or description" aria-label="Filter etchings" style="flex:1 1 220px;max-width:320px"><div class="seg" id="etag" aria-label="Tag"></div></div>
      <div class="ucgrid" id="etgrid">${cards}</div><p class="empty-note" id="etnone" hidden>No etching matches.</p>
      <p style="font-size:.76rem;color:var(--muted);margin:10px 0 0">Text: the in-game description with this stage's roll filled in the way the game prints it (tick durations as whole seconds). Some in-game texts misreport their rolls: Nova Damage Increase prints its damage roll as the mana threshold and the other way round. Ranges: each bracket's roll range in the units its text uses (ticks shown as seconds); g = the lowest greed tier of the bracket, hover for its span; gold = the bracket this stage rolls from. Gear: the etching table's type groups; the model treats battlestaffs and rangs as Sword, tridents as Axe and plushies as Focus. Tags and notes: catalog.ETCHING_NOTES in model/catalog.py.</p></div>
