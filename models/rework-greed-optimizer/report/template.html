  wireTags();
  const fi = $("#etfilter");
  fi.value = S.eq;
  fi.oninput = ev => { S.eq = ev.target.value; applyFilter(); };
  applyFilter();
  document.querySelectorAll("tr.nrow").forEach(tr => {
    const tog = () => { const d = tr.nextElementSibling; d.hidden = !d.hidden; tr.setAttribute("aria-expanded", String(!d.hidden)); };
    tr.onclick = ev => { if (ev.target.closest("button.fam")) return; tog(); };
    tr.onkeydown = ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); tog(); } };
  });
  document.querySelectorAll("button.fam").forEach(btn => btn.onclick = ev => {
    ev.stopPropagation();
    const b = BY_KEY[btn.dataset.k];
    S.view = "ledger"; S.stage = b.stage; S.sel = b._key; S.detail = true; S.piece = null;
    if ((b.variant === "eot" && S.eot === "no") || (b.variant !== "eot" && S.eot === "only")) { S.eot = "all"; store.set("eot", "all"); }
    store.set("view", "ledger"); store.set("stage", b.stage); render();
    if (narrow()) window.scrollTo({top: 0});
  });
}

/* ---------- method ---------- */
function renderMethod() {
  const K = META.knobs;
  const kn = name => { if (!(name in K)) flowWarn("method-knob-" + name, `method page: knob ${name} is not in this result (an older run); shown as "-"`); return K[name]; };
  const kv = name => { const v = kn(name); return v === undefined ? "-" : esc(v); };
  const speedLo = kn("speed_lo"), speedHi = kn("speed_hi"), risk = kn("survival_risk"), attempts = kn("survive_hits");
  const bySpeed = (s, lo, hi) => [speedLo, speedHi, lo, hi].every(fin) ? lo + (hi - lo) * Math.min(1, Math.max(0, (s - speedLo) / (speedHi - speedLo))) : undefined;
  const kq = p => {
    const n = Math.round(attempts);
    if (![p, n, risk].every(fin)) return undefined;
    if (p <= 0) return 0;
    if (p >= 1) return n;
    const q = 1 - p, r = p / q;
    let tk = 1, c = 0;
    for (let i = 0; i < n; i++) tk *= q;
    for (let k = 0; k <= n; k++) { c += tk; if (c >= 1 - risk - 1e-9) return k; tk = tk * (n - k) / (k + 1) * r; }
    return n;
  };
  const kqText = p => { const v = kq(p); return v === undefined ? "-" : String(v); };
  const avoidRows = [1.5, 2.0, 2.5, 3.0].map(s => {
    const a = bySpeed(s, kn("avoid_lo"), kn("avoid_hi")), rb = kn("ranged_bonus");
    return `<tr><td class="num">${pct(s)}</td><td class="num">${pct(a)}</td><td class="num">${pct(bySpeed(s, kn("castle_uptime_lo"), kn("castle_uptime_hi")))}</td><td class="num">${kqText(fin(a) ? 1 - a : undefined)}</td><td class="num">${kqText(fin(a) && fin(rb) ? (1 - a) * rb : undefined)}</td></tr>`;
  }).join("");
  const critM = kn("hyper_boss_crit_mult");
  if (META.boss_table.length && !("crit_chance" in META.boss_table[0])) flowWarn("method-crit-chance", "method page: the boss table has no crit_chance column (an older run); shown as \"-\"");
  const t = META.boss_table.filter(r => r.cycle <= 25);
  const chart = (keys, lo, hi, label) => {
    const W = 640, H = 210, pad = 44;
    const lx = c => pad + c / 25 * (W - pad - 12);
    const ly = v => H - 26 - (Math.log10(Math.max(v, 1)) - lo) / (hi - lo) * (H - 44);
    const ticks = [];
    for (let e = Math.ceil(lo); e <= hi; e += 2) ticks.push(`<line x1="${pad}" x2="${W - 12}" y1="${ly(10 ** e)}" y2="${ly(10 ** e)}" stroke="#2c2a36" stroke-dasharray="3 3"/><text x="6" y="${ly(10 ** e) + 4}" font-size="11" fill="#7d7c8c">1e${e}</text>`);
    const xt = [0, 5, 10, 15, 20, 25].map(c => `<text x="${lx(c) - 4}" y="${H - 8}" font-size="11" fill="#7d7c8c">${c}</text>`).join("");
    const lines = keys.map(([k, color, name, dash], i) => `<polyline points="${t.map(r => `${lx(r.cycle).toFixed(1)},${ly(r[k]).toFixed(1)}`).join(" ")}" fill="none" stroke="${color}" stroke-width="2.5"${dash ? ' stroke-dasharray="5 4"' : ""}/><text x="${pad + 10}" y="${20 + 16 * i}" font-size="12" fill="${color}">${name}</text>`).join("");
    return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${label}, log scale">${ticks.join("")}${xt}${lines}<text x="${W / 2 - 16}" y="${H}" font-size="11" fill="#7d7c8c">cycle</text></svg></div>`;
  };
  const bossRows = META.boss_table.map(r => `<tr><td class="num">${r.cycle}</td><td class="num">${Math.round(r.chaos)}</td><td class="num">x${r.hp_factor.toFixed(1)} <span style="color:var(--muted)">(${r.hp_factor_p10.toFixed(1)}-${r.hp_factor_p90.toFixed(1)})</span></td><td class="num">${num(r.health)}</td><td class="num" style="color:var(--muted)">${num(r.health_base)}</td><td class="num">${num(r.damage)}</td><td class="num">${num(r.hit_fixed)}</td><td class="num">${num(r.hit_shipped)}</td><td class="num">x${r.frenzy.toFixed(2)} <span style="color:var(--muted)">(${pct(r.p_frenzy)})</span></td><td class="num">${pct(r.crit_chance)}</td></tr>`).join("");
  const fb = Object.entries(META.fallbacks || {});
  $("#main").innerHTML = `<section class="panel orn page"><div class="prose">
    <div class="eyebrow">Method</div>
    <h3 style="margin-top:4px">How a build is scored</h3>
    <p>Every build is graded against the hyper vault's final boss. Its health and damage both grow by x${META.hyper.stat_factor} per cycle, so damage and survivability have to keep pace together. The vault's chaos modifiers add to the boss's health on top (see Hyperboss by cycle). A build's hyper cycle is the highest cycle where it both kills the boss within ${K.kill_time_s} seconds and survives the boss's hits. The weaker side decides. Early and mid builds land below cycle 0 because the cycle-0 boss already hits for about 75k.</p>
    <p>Boss DPS is reduced by ${pct(K.boss_shield_downtime)} because the hyperboss's rune shield blocks every hit for 100 of every 500 ticks. Percent-missing-HP execution is capped at +${K.execution_cycle_cap} cycles over the same build without it, since regular hyper mobs still need real damage.</p>
    <p><b>Survival.</b> The boss makes one attack attempt every ${kv("hit_interval_s")} s at its cycle's attack damage. By code its melee lands at most once per 1.5 s; the shorter interval stands in for its summons, the adds and the brutal waves, which are not modeled as attackers of their own. Magic Missiles are folded into the avoidance curve, and WaveBlast is taken as always escaped (proposed: its cube shrinks from 30 to 15 blocks so that it can be). An attempt reaches the player unless it is avoided: avoidance rises linearly with stable movement speed from ${pct(kn("avoid_lo"))} at ${pct(speedLo)} to ${pct(kn("avoid_hi"))} at ${pct(speedHi)} and is clamped outside (calibrated against Magic Missiles, the hardest attack to dodge; knobs avoid_lo, avoid_hi, speed_lo, speed_hi). A ranged build (below) takes x${kv("ranged_bonus")} of the attempts. The Immortal Seal rolls after block and before dodge: each hit it sees opens 100 ticks of immunity with its 5% chance p, negating that hit and every attempt inside the immunity, so the share that still lands is (1/p - 1) / (1/p + n x a), with n the attempts per immunity and a the share of attempts that reach the player and pass block. Block and dodge are luck-scaled; dodge is capped at 95%, Sneaky Getaway's Ninja dodge inside the cap. Over a window of ${kv("survive_hits")} attempts the landed count K is binomial, and the build must survive k<sub>q</sub> landed hits, the smallest k with P(K &le; k) &ge; ${pct(1 - risk)} (knob survival_risk ${pct(risk)}): each of the k<sub>q</sub> hits may take at most (max HP + (k<sub>q</sub> - 1) x healing per interval) / k<sub>q</sub>, with Mana Shield's pool and Ultimate Shield's absorption on top (Shields, under Model details); Adaptive Armor averages over the k<sub>q</sub> hits. k<sub>q</sub> = 0 sets no window limit. Separately, a hit at full health that nothing avoids, blocks, dodges or absorbs must never take more than max HP (the one-shot test). Immortal's revive cancels a lethal hit and sets health to max, once per 600 s (once per fight): a build that survives m hits from full health dies on hit m + 1, revives and survives m more, so the window needs only floor(k<sub>q</sub> / 2) hits from full health (none at k<sub>q</sub> = 1); the one-shot test passes at any hit size only when at most one hit lands in the whole ${META.knobs.kill_time_s} s fight at the same risk, since a second landed hit would kill. The weaker test decides; each build names it ("window" or "one-shot"). Past that one-shot cycle a build may go ${K.oneshot_extra_cycles} more cycle${K.oneshot_extra_cycles === 1 ? "" : "s"} if it heals at least ${pct(K.oneshot_heal_fraction)} of its max HP between hits (one-shot protection, knob oneshot_protection; the max-HP loss from repeated procs is ignored). One-shot protection applies only to the "As shipped" ledger: in "Bugs fixed" a one-shot is death, so a build's survival cycle never passes its one-shot cycle. Builds with very low max HP clear that bar with flat healing alone; these get the "one-shot protected" chip.</p>
    <p><b>Hit size.</b> Every boss hit is taken as a crit at x${kv("hyper_boss_crit_mult")}: the chaos pools push the roster's crit chance to 1 by cycle 3 (the expected chance per cycle is in the boss table). Crit mitigation reduces it to 1 + ${fin(critM) ? +(critM - 1).toFixed(3) : "-"} x max(0, 1 - crit mitigation). Armor, resistance, Castle Bastion, absorption (Mana Shield, Ultimate Shield) and Last Stand then apply in that order; the game runs Castle Bastion, both shields, Adaptive Armor, Temporal Shielding and Last Stand at LivingDamageEvent LOWEST in registration order, so their order is an assumption. Castle Bastion's stacks count at an uptime that falls with stable speed, ${pct(kn("castle_uptime_lo"))} at ${pct(speedLo)} to ${pct(kn("castle_uptime_hi"))} at ${pct(speedHi)} (knobs castle_uptime_lo, castle_uptime_hi): a faster player stands still less.</p>
    <div class="tablewrap"><table class="t"><thead><tr><th>Stable speed</th><th>Attack avoidance</th><th>Castle Bastion uptime</th><th>Landed hits planned for, melee range</th><th>Landed hits planned for, ranged</th></tr></thead><tbody>${avoidRows}</tbody></table></div>
    <p style="font-size:.8rem;color:var(--muted)">Landed hits planned for = k<sub>q</sub> of ${kv("survive_hits")} attempts at ${pct(1 - risk)} confidence, before block, dodge and the Immortal Seal, which lower it further.</p>
    <p><b>Health state.</b> The share of the fight above 80% and below 20% HP comes from a sawtooth (knob hp_state_heuristic): landed hits arrive at rate &lambda; (the landed share per attempt / interval), each takes f = hit / max HP at the cycle the build is scored at, and healing refills r = healing / max HP per second. After a hit at full health the player spends (f - 0.2) / r below 80% (at most the gap between hits), so u<sub>high</sub> = 1 - min(1, &lambda; (f - 0.2) / r), 0 when f &gt; 0.2 and nothing heals, and u<sub>low</sub> = min(1, &lambda; max(0, f - 0.8) / r). Sorcery, Prime Amplification and Stoneskin count at u<sub>high</sub>, Berserking at u<sub>low</sub>; Last Stand multiplies the window's hits by 1 - its reduction x u<sub>low</sub> and never touches the one-shot test. A build is scored once, then again at its scored cycle if the state changes anything (at most two passes). The heuristic ignores absorption and the shape of the healing curve. Off: u<sub>high</sub> = 1, u<sub>low</sub> = uptime_low_hp.</p>
    <p><b>Ranged builds.</b> A build is ranged when it does not weave, is not a melee family, and every damage source in its rotation reaches at least ${kv("ranged_reach")} blocks (knob ranged_reach): projectiles and targeted abilities reach any distance, self-centred AoEs and Smite radius x area of effect, Hungry Maw's fang line 1.5 x that, contact and hits-taken sources 0. Counterstrike and thorns do not disqualify a build; they only lose rate. A ranged build takes x${kv("ranged_bonus")} of the boss's attack attempts (Ranged Build Survivability Bonus, knob ranged_bonus). Weaving forfeits it; Hungry Maw cast from range keeps it. The vaultarang family is ranged by definition. The Damage tab's flowchart shows each build's positioning and every source's reach.</p>
    <p><b>Healing.</b> Everything below is multiplied by healing effectiveness (1 + the attribute, no cap; Methodical counts at the low-mana uptime). Against a boss, gear leech heals max HP x leech on every damage instance that can leech (the damage/max-HP cap is skipped for bosses; AoE, DoT, javelin, totem, effect and reflect hits never leech, nor do minions). Life Steal heals max HP x its percentage on every lucky hit of a melee or fang hit. Heal is cast whenever the build has mana it would otherwise not spend, at most once per cooldown. Any on-kill-heal modifier gives Bloodthirst, which turns all of this off. Regeneration is left out: vanilla Regeneration I to IV heals 0.4 to 3.3 HP/s, and a capped hyper vault averages about one Regeneration level from its chaos modifiers.</p>
    <p><b>Thorns.</b> Every boss attack that reaches the player reflects (after avoidance and the ranged factor; blocked and dodged ones included; Counterstrike counts the reaching attacks that block or dodge stops, Frozen Throne the landed ones): attack damage x 2 x thorns damage (the Thorns talent is hidden in 0.34.1, so this part is 0) + flat thorns. Shell (Porcupine) multiplies flat thorns by 1 + its bonus whenever it is read, so it also boosts Battering Ram and Grass Sword. Reflect hits take damage increase, the registry, Vulnerable, double hit and echo, and lucky hits only with Lucky Thorns. They never take execution or Rampage. A reflect does not depend on the size of the hit taken. For other builds, thorns adds nothing: the boss's i-frames are already used by their own hits.</p>
    <p><b>Uniques.</b> A unique replaces the whole piece. Its affixes are fixed (top open bracket at ${pct(META.stages.early.unique_roll_quality)} of the range early and mid, ${pct(META.stages.max.unique_roll_quality)} late and max). It can be sealed (the seal replaces one explicit, chosen by the search) and etched (WV's etching-table mixin allows uniques). Its power is listed with the etchings and doesn't count toward the etching limit. Limits: ${STAGES.map(st => `${STAGE_LABEL[st]} ${META.stages[st].unique_max >= 7 ? "any number" : META.stages[st].unique_max}, ${META.stages[st].unique_seals} sealed`).join("; ")}. From mid on the offhand must be the time plushie, so no offhand uniques. ${BUILDS.some(b => b.without_uniques) ? 'Every build was also searched with uniques banned ("Best without uniques" on each build).' : ""} Powers the boss ignores or that only matter with adds are listed as not counted. The Castle's Bastion counts at the speed-dependent uptime under Hit size.</p>
    <p><b>Trinkets and movement.</b> Early, mid and late use the Standard Trinket Pouch (1 red, 1 blue, 1 green slot), max the Prismatic (2 of each). From mid on the Zephyr Charm takes one blue slot. Late and max can fuse trinkets: a slot holds one trinket or a fused pair, and a pair must include the slot's colour (a combat trinket can also sit in another colour's slot fused with a non-combat trinket of that colour). Boots always carry Multi Jump as their bonus implicit. Effect negation is mandatory at every stage (knob effect_negation_required): a build carries the Carapace trinket or the Blessed etching (Divinity), or it misses a requirement like the mana minimums; early builds have no Blessed and one red slot, so Carapace takes it and The Dice leaves them. The Immortal Seal (Survival) and Velara's Petal (regeneration) are offered as well. All reachable prestige powers are owned (no knowledge budget); Swiftness Amplified, where reachable, multiplies movement speed by 1.25.</p>
    <p><b>Bug-dependent legality.</b> As shipped, a battlestaff keeps the offhand's stats (OFFHAND-STAFF), so the time plushie still works. With that bug fixed the plushie's time-acceleration immunity is dropped too, so from mid game (where hyper vaults need it) battlestaffs are not legal in the "Bugs fixed" ledger. As shipped, max mana stops at 4096 (MANA-CAP, a RangedAttribute limit); with bugs fixed it is uncapped.</p>
    <p><b>Mana.</b> The vault is continuous, so the mana pool is never a source: mana in is regeneration (gear, talents, trinkets; the Mana Regen Totem adds to the same multiplier as gear regen) plus Mana Steal, which restores max mana x its percentage on every lucky hit. Only melee and fang hits roll lucky hits. Everything a build casts has to be paid from that; when it can't, the main ability casts at the fraction of its cooldown rate the mana covers. An ability whose cost exceeds max mana is never cast (share 0, fallback cast-unaffordable-&lt;spec&gt;). Implode as the main ability spends what its share of the regeneration brings in over one cooldown, at most the bar. The share of the fight below 20% mana (Depleted, Methodical) comes from the mana flow (knob mana_state_heuristic): 1 when a damage ability is mana-limited (the bar is spent as it fills); with sneak-cast Power Dump the time to refill the first 20% after each dump, min(1, dumps per second x 0.2 x max mana / inflow), inflow being supply minus the buffs' drain; otherwise 0. The Nova Damage Increase etching uses the same rule at 50% and counts its strongest copy only (the game compounds copies, NOVA-LOWMANA-STACK, modeled as fixed). Hexbreaker counts at 1 - the product of (1 - uptime) over the harmful effects the build keeps on the boss (Vulnerable, Hypothermia, Slowness, Poison, Wither, Weakness, Bad Luck, Fear, burning, the Necromancy curse, the Totem mark), on ability-power hits only.</p>
    <p><b>Melee weaving.</b> Ability builds may swing their mainhand between casts at full Better Combat speed (the search turns it on or off per build; casting is assumed not to interrupt swings). Swings add lucky hits, leech, Life Steal and Mana Steal, and their damage is scored (knob score_swings) as the "melee swings" rotation row, a secondary source under the share rule below. Every swing clears the boss's i-frames and opens a 10-tick (0.5 s) window, and so does every other ability's hit: see the rotation paragraph for how plain hits are clipped. Instant-landing hits (Ice Bolt, Smite, Charged Bolts, Storm Arrow, Blizzard, DoTs) and Fangs are never clipped. The clip uses the average combo swing, and multi-hit casts are clipped hit by hit. The "Melee weaving" row shows the split and the same build re-scored without weaving (not re-optimized). The main ability has mana priority over Rampage in ability builds.</p>
    <p><b>Multi-ability rotation.</b> Ability builds may learn up to ${kv("max_secondaries")} secondary damage abilities (players can only juggle a few casts), and the end of every search drops each secondary worth less than ${kv("secondary_min_value")} cycles of score on its own, weakest first; every learned one is cast as it comes off cooldown from one mana bar. Maintenance buffs are paid first. The damage abilities then share the rest greedily by damage per net mana (each evaluated alone; a cast whose Mana Steal exceeds its cost adds the surplus to the bar), which is optimal because each ability's damage is linear in the share of casts it keeps. Rampage runs on what is left, then a non-main Implode on the remainder. Abilities are treated as instant (no cast lock). Arcane Cascade (the Arcane_Strike talent) takes (int)(cooldown ticks x its percentage) off every ability on cooldown on each lucky hit (swings, woven swings and fang hits on the boss), so a cooldown runs at 1 / (1 + lucky hits/s x that reduction); the lucky-hit rate is solved as a fixed point because shorter cooldowns can add lucky hits, and the reduction can go below the cooldown-reduction cap. The solver (a secant step, then Illinois regula falsi once the sign changes) rounds every trial to a 2<sup>-20</sup> grid, so a build lands on the fixed point's grid cell; a build whose lucky-hit rate jumps across L = f(L) has no fixed point, gets the flag cascade-unconverged and keeps the last trial. The Lucky Reset etching joins the same fixed point and resets one ability: the main ability if its pool names it, else the pooled secondary with the highest full-rate damage. In 0.34.1 each lucky hit removes (int)(25% of the max cooldown). In the rework (proposed) it rolls on helmets only, each proc removes 10% of the remaining cooldown, and each cast of any ability procs it at most once (so a Hungry Maw cast's fangs proc it once, with chance 1 - (1 - lucky)<sup>fang hits</sup>); in mean field the remaining cooldown R falls at dR/dt = -1 - 0.1 x procs/s x R and runs out after ln(1 + k R<sub>0</sub>) / k, k = 0.1 x procs/s. Every plain-hurt hit (${REWORK ? "" : "Fireball, Volley, "}Nova, Arcane, Chain Lightning, Earthquake, Implode, Totem, thorns reflects, Javelin and others) can land inside another stream's 0.5 s i-frame window: the chance is 1 - the product over the other streams (woven swings included) of (1 - min(1, 0.5 s x their hits/s)), and inside a window it keeps its raw minus the raw of the hit that opened it (stream j with weight hits/s of j over all), averaged over the streams; at or below that raw it is dropped, procs included. Weak filler hits therefore change how much stronger hits keep, as in game. Boss debuffs that come from casting (Totem of Hatred's mark, Hungry Maw's Slowness, the Necromancy curse, Hypothermia from Shard Blizzard) scale with each ability's share of casts. Power Dump (proposed rework) applies only to abilities cast while sneaking, and the search picks which ones per build: each sneaking instant cast empties the bar, so its surplus is the mana that came in since the previous sneaking cast (every other cost, toggles included, is paid first) minus its own cost; a sneaking held channel (Arcane) drains ${pct(kn("pd_hold_drain"))} of the bar per second and counts the drain above its cost as the surplus; free Ethereal casts count the whole amount; the bonus multiplies that cast's own hits only. A sneaking Starforge nova (proposed) spends the bar like a free sneaking cast: it joins the sneaking casts' dump rate and shares their average bar; a build whose only sneaking cast is the nova refills min(max mana, spare mana / nova rate) between novas. Ethereal makes each mana payment free with its chance. Battle Cry: Spectral Strike (proposed rework) gives each qualifying hit up to its per-hit stacks (30 stacks per cast from a boss, spread over the hits in proportion to their rates), each adding ${kv("spectral_ap_per_stack")} x base ability power: to attack damage on swings, fang hits and Lucky Bolt Ice Bolts, to ability power on Fireshot and Arcane Rail; the hit's own multipliers then scale it. The family's main ability, its echoes included, must deal at least ${pct(kn("main_damage_share_min"))} of the build's damage, woven swings, the Starforge nova they proc and cloud poison counting as secondaries: during the search the gap costs 40 x gap score with no step, and the end of every search drops secondaries (or weaving) until the share holds, so every reported build meets it. A build whose single secondary or swings would take more than ${pct(kn("secondary_flag_share"))} at its full cooldown rate gets the flag "secondary-hungry" with that share (knob secondary_flag_share), which shows what the rule holds back. The Rotation row in each build shows the split.</p>
    <p><b>Echo.</b> The boss holds one Echoing effect: it pulses every 10 ticks for floor(1 + effect duration) pulses, a stronger echo takes the slot, a weaker one waits behind it, an equal one extends it, and each pulse can re-proc at the square root of the echo chance (luck applies to both rolls) with decaying damage. So echo damage is a property of the target, capped near 2 pulses per second, not a per-hit bonus. The model reads the pulse rate from a table built by simulating those rules tick by tick (within 2% of fresh simulations), fed by every eligible stream (main and secondary abilities, Echoing Smite re-strikes and Lightning Strike Delay's bolts, Counterstrike, swings, woven ones included); streams of different strength split the pulses strongest first. Clipped hits store only their clipped amount; Power Dump's larger casts store more.${kn("echo_inherits_rampage") ? " Echoes of direct melee and fang hits store the hit with Rampage's damage increase (Fury included) once (knob echo_inherits_rampage, proposed: the game stores the echo before Rampage, so today they get neither)." : ""} With the Reverberating Echo etching the pulses deal nothing: every echo proc that finds a live echo deals the stored hit x its decay at once and re-procs it, read from a second simulated table (tools/echo_table.py --reverb), so it pays most on fast streams.</p>
    ${REWORK ? `<p><b>Greed update ledger.</b> Built from the greed-rework code (addon feature/extraction-vaults, pack objective-difficulty configs) with every known bug fixed, so there is one pass per stage. The ledger is the canonical functional version of the balance: catalog_rework.json is the ledger's state, not any pack's, and the port to the greed test instance follows from the change notes. Abilities, talents, gear, uniques, trinkets and cards come from the ledger-bugfixes pack, whose talent table is the 0.34.1 one (user ruling); the god trees come from greed-test-dist. greed-test-dist differs: it has no Hexbreaker, Blood Chakra or Ultimate Shield and other Mana Steal, Life Steal, Fatal Strike and Arcane Strike values. Stages are greed ranks ${STAGES.map(st => esc(META.stages[st].label)).join(", ")}. Greed cards are ${STAGES.map(st => META.stages[st].greed_card ? `${META.stages[st].greed_card.replace("greed_", "")} (${STAGE_LABEL[st]})` : null).filter(Boolean).join(", ")} on the same layouts as before; each adds its roll minus 1 to the slot it targets. Ancient uniques (rolls about 1.0-1.33x the regular top bracket, sealable with the regular unique seal pool) are allowed ${STAGES.map(st => `${STAGE_LABEL[st]} ${META.stages[st].ancient_max >= 99 ? "any number" : META.stages[st].ancient_max}`).join(", ")}, counting toward the unique limit.</p>
    <p><b>God trees.</b> The old greed tree is gone. Each stage has a god-XP pool (${STAGES.map(st => `${STAGE_LABEL[st]} ${num(META.stages[st].god_xp)}`).join(", ")}) the search splits between the four gods; XP becomes a level by the god_levels curve and a level becomes points (3 at level 1, +3 per level to 10, +2 after) plus reputation / 10 (reputation ${META.stages.max.god_reputation} for every god at mid and later, ${META.stages.early.god_reputation} early; sacrifice gates assumed done). Every star costs one point and needs a taken neighbour or is a root. The charm's god runs its whole tree; the others give their stat and root stars at 25% and their minors only through their minor transfer slots, majors never. Charm prefixes scale with the charm god's piety: base x (reputation + 2 x level + Pious Devotion stars + 1). A greed rank needs one god at its gate level. Temporal Breaking (Wendarr, in the active tree or a Wendarr transfer slot) gives time-acceleration immunity, so the offhand is free and a battlestaff is legal; otherwise the offhand must be a non-unique plushie.</p>
    <p><b>God node effects.</b> Plain stat stars add their attribute. Custom stars are modeled from the addon code: Grand Archmage (x3 ability power, mana, but every weapon swing and its procs are cancelled), Ultra Rampaging (steady-state Fury from your hits per second on the boss, raising Rampage and the damage you take), Immortal (x0.5 damage, x1.25 HP and armor, regeneration, one revive per fight: the window needs half the landed hits from full health, and the one-shot test passes only when at most one hit lands in the fight), Crushing Blows, Weaponmaster, Pincushion (prior hits over half the ${META.knobs.kill_time_s} s kill), Overcrit, Luckiest Hit, True Rage, Power Dump, Counterstrike (an attack-damage hit, so it scores only for melee builds), Adaptive Armor, Fleeting Physicality, Cactus, The Stonewall, Healing Flow, Malediction, Deep Reserves, Mana Starved, Unstoppable Greed (x(1 + 0.05 x (item quantity + rarity))), Kinetic Impact, Speed Demon, Stack nodes, Utilized and Plushie Lover. Situational stars use vault averages: Surrounded by ${META.knobs.god_surrounded_mobs} mobs, Banked Anger at ${num(META.knobs.god_banked_damage_taken)} damage taken, Under Pressure and Paced Strikes averaged over a uniform 0-${META.knobs.god_vault_minutes} minutes left, Sneaky Advantage counts the harmful effects the build keeps on the boss, weighted by uptime: Vulnerable, Hypothermia (Frost Nova or Shard Blizzard), Totem of Hatred's mark, fang Slowness, the Necromancy curse, and the effects of hexing, burning hits and effect clouds (from normal hit rates, luck-affected). The hyperboss ignores Glacial Shatter, stuns and Bleed${REWORK ? "; Chilled lands on it (proposed): at chill level clamp(floor(L / 5), 1, 5) for a source of level L (amplifier + 1), from Frost Nova (its casts, Frozen Throne and the Lucky Nova etching), Shard Blizzard shards, Ice Bolt hits, hexing and Chilling clouds, counted for Sneaky Advantage and Hexbreaker; Glacial Shatter stays denied, the slow gives no survival credit, and Ice Bolt's splinters still never hit the boss (they ignore the target they split from)" : " and Chilled"}. Gold Plating is banned. Speed Demon is allowed only in the Edge of Time builds (its faster vault clock is a time cost). Not counted (no effect on a hyperboss or needs something the model lacks): ${Object.entries(UI.godTrees.notCounted).map(([e, r]) => `${esc(e.split("_").slice(1).join(" "))} (${esc(r)})`).join("; ")}. Ultimates and party-only stars are left out. <b>Proposed balance in this ledger</b> (not in the pack yet): flat attack-damage, ability-power, lucky-hit-chance and flat-thorns deck cards are removed, and thorns % cards (a new stat that multiplies flat thorns the way AP% multiplies AP, with the Damage Increase cards' values) take the flat thorns cards' place; a build owns at most one major per god tree; the Berserking and Depleted talents are global damage (ability-power and AoE hits take them too; the rest of the multiplier registry stays on normal hits); Aurora Scissors' AP scaling and Grass Sword's thorns scaling add their damage after Damage Increase and the registry, so neither ability power nor thorns is multiplied by the attack-damage pools; leech, Mana Steal and Life Steal proc at most once per fang cast (Hungry Maw, Evoker Fangs); Grand Archmage cancels only direct weapon swings, so fang and other ability hits land (the addon cancels fang hits today, a bug); Immortal is x1.25 HP and armor, x1.33 healing, +15 health, +30 armor, +8 Regeneration levels and a revive every 600 s (still one revive per fight); Ultra Rampaging takes at most x1.5 damage at full Fury; Grand Archmage gives x3 ability power; Unstoppable Greed adds 5% of item quantity + rarity (was 10%); Speed Demon is limited to Edge of Time builds; The Stonewall slows you to x0.4 movement speed (was x0.33), still with x1.5 armor; Power Dump works only on casts made while sneaking: max mana sets the largest bonus, per_mana x sqrt(${kv("power_dump_sqrt_ref")} x max mana), and a cast gets that bonus times the share of the bar it spends above its cost (linear in the bar, so dumping often or rarely pays the same per second), keeping it for that cast's hits (no 45 s window); a build that sneaks the whole fight empties the bar on every instant cast, buffs included, while a build that mixes sneaking and standing casts dumps once per bar fill and loses ${kv("pd_sneak_window_s")} s of casting per dump (0.33 s into sneak, 0.33 s out; swings go on), a cast due inside a window waiting for its end; either way the time spent sneaking multiplies the speed avoidance by ${kv("sneak_avoid_factor")}; every Implode gets the bonus for the share of the bar it consumes, sneaking or not; a sneaking Starforge nova spends the bar like a free sneaking cast${kn("echo_inherits_rampage") ? "; echoes of melee and fang hits store the hit after Rampage and Fury, once" : ""}; Ultimate Shield takes x${kv("ultimate_shield_scalar_mult")} the configured mana per absorbed point (4.5 at tier 8 and 0.6 at tier 30 with the default 2) and drains min(base + ramp x seconds on, maxManaDrainPerTick) mana per tick as its config says (the addon caps the drain at maxManaDrainPerTick x regeneration / 20); fang hits roll lucky hits without the charged-swing check; WaveBlast's cube shrinks from 30 to 15 blocks (a pack config change still to make); Lucky Reset rolls on helmets only, each proc removes 10% of the remaining cooldown and each ability cast procs it at most once; Concentrate's Empower chain takes at most 10 + floor(ability level / 3) procs; Ultimate Shield stays on while one tick's regeneration covers one tick's drain. Bugs modeled as fixed: Colossus Titan's raised resistance limit stops at 95% (both ledgers; the addon adds the roll after its clamp, so 100% resistance means immunity); Concentrate pays its reduced cost and counts as a cast; the Frost Nova on-damage seal counts on armor only; fangs, Hungry Maw and Concentrate roll their cooldown skip once (the addon sets the cooldown twice, so a skip needs both rolls); Storm Arrow's roll stays between its minimum (with Lightning Damage) and maximum (the game rolls 0-100% once the minimum reaches the maximum). Stable movement speed (gear, permanent talents and nodes; no Zephyr Charm or temporary buffs) must be at least ${pct(META.knobs.min_move_speed)}: a build below it misses a requirement like the mana and cooldown minimums. Above it, speed pays through attack avoidance, Castle Bastion's uptime and Kinetic Impact (Survival); Empower's speed counts only when the rotation pays the toggle in full, Sneaky Getaway's never. The search relaxes only this requirement during the first half of each anneal, so builds such as The Stonewall's x0.4 speed are still explored before the minimum is enforced; every reported build meets it. Regeneration from god nodes, Velara's Petal and regeneration uniques heals 1 HP per (50 >> amplifier) ticks. Healing effectiveness above 100% no longer boosts leech or Life Steal (the addon clamps it while leeching).</p>
    <p><b>Uniques and on-hit effects.</b> Every unique modifier was audited against the code; each card's power notes say what is counted and why the rest is not. Level bonuses keyed to a specialization (for example +3 Storm Arrow Base) count for that specialization, as SkillBonusTierCache does. Vulnerable keeps the strongest application and has no amplifier cap from any source (proposed: the game clamps the Totem damage etching, Lucky Hit and Blizzard shards to min(8, level) - 1). Cooldown-skip chance (Echoflare) scales every cooldown by (1 - chance). Ancient Sweetheart's Total Health multiplies max health. The Steadfast star adds half of the knockback resistance over 100% to the build's Armor % (proposed: 0.5 per point, summed with deck Armor % cards, Velara's Armored nodes and greed nodes; the pack multiplies armor by 1 + the full excess). Frozen Throne casts your own learned Frost Nova for free on hits that get through (chance per hit, blocked and dodged hits excluded); with Frozen Orb those casts carry its Vulnerable. Pocket Penguin's Imploding Javelin casts your learned Implode on every plain-Javelin hit for current mana x its share, free, so a sneaking Power Dump throw (which empties the bar) cancels it. Starforge's arcane nova lands inside the triggering swing's i-frames, so only its damage above that swing's raw counts. Multi-jump rule: normal boots with the Multi Jump implicit, or the Prismatic Feather trinket; with the feather the boots may take another implicit or be a unique. <b>Proposed unique balance</b> (not in the pack yet): Helm of the Warbound's split javelins home in on the nearest enemy, so a Scatter throw that splits on the ground lands all numberOfJavelins children on the boss (with the ancient's Splitting Javelins roll S, the throw first splits into S javelins that each split again, S x numberOfJavelins hits); Frozen Orb's Frost Nova adds its value once to the target's existing Vulnerable; Ancient Frostguards gets +5 Frost Stonefall levels and 12-16 armor; Inferno's Reach becomes Steel Inferno: its Fireball AoE roll is replaced by a smaller explosion (base radius x0.5-0.6, ancient x0.55-0.65) with a centre bonus B of +150-200% (ancient +175-225%) falling off as B x (1 - (d/R)<sup>2</sup>), a step of its own on Fireball, Volley, Mitosis and Everflame explosions (not Fireshot): x(1 + ${kv("steel_inferno_boss_efficiency")} x B) on the boss (knob steel_inferno_boss_efficiency: hits measured to the nearest point of its hitbox) and x(1 + ${kv("steel_inferno_pack_mean")} x B) on pack mobs (knob steel_inferno_pack_mean, the disc mean), pack targets from the smaller radius; Stormcrown's storm locks onto the mob closest to the arrow's hit and follows it at up to 10 blocks/s, so all its bolts hit the boss, and its two storm rolls leave the seal pools; the ancient Tri-Rang is named Ancient Quad-Rang. A stationary storm cloud (Storm Arrow without Stormcrown, Shard Blizzard) holds the boss ${pct(kn("storm_boss_occupancy"))} of the time (knob storm_boss_occupancy), so that share of its bolts and shards hits it${REWORK ? "" : " (1 = not modeled in this ledger)"}.${REWORK ? " Fireball, Volley and Mitosis explosions neither set nor respect i-frames (proposed: DamageUtil.shotgunAttack), so every explosion of a Volley cast (bounces + 1, plus the Mitosis children) counts on the boss and their hits never open a window for other streams; Mitosis pack damage is every explosion times the expected pack mobs inside its radius (the pack_targets disc rule), replacing the in-game estimate. Everflame and Fireshot are unchanged." : ""}</p>
    <p><b>Edge of Time builds.</b> Edge of Time (x10 damage) and Temporal Shielding (x0.1 damage taken) cost 1-3 s of vault time per hit, which has no exchange rate against damage, so they are banned from the main search. After it, a second search starts from each family's best build, forces the path to Edge of Time with the charm on Wendarr, reheats and anneals again with both nodes allowed. If that build uses either node it is listed as its own "(Edge of Time)" row.</p>` : ""}
    ${REWORK ? `<p><b>Execution.</b> The greed update turns execution into an execute threshold: a hit on a target at or below X% of its max health kills it outright. Gear execution damage sets X on normal melee hits, and an Executing Strike lucky hit adds 4% + 2% per tier on top (Vorpal and Kitsune execution rolls are halved). Bosses, the hyperboss included, take half the threshold. The model counts it as damage: the kill needs only (1 - threshold) of the boss's health.</p>` : ""}
    <p ${REWORK ? 'hidden' : ''}><b>Execution.</b> Missing-HP execution damage does not exist in the "Bugs fixed" ledger (user ruling: it would be patched out): the Executing Strike talent, the corrupted execution affix on gear, the execution unique seal, Young Kitsune's execution affix (the blade keeps its other affixes) and the Ravenous Fangs etching are all removed. Executioner (a flat damage bonus on low-HP targets) is not missing-HP scaling and stays. Everything stays in the as-shipped ledger.</p>
    <p><b>Open questions for you.</b> Cloud poison is flat amplifier + 1 damage per second, before Vulnerable, Frenzy, The Dice, Executioner and the god registry, so a DoT-cloud build cannot compete without a scaling change (yours to decide). Settled on 2026-10-19: Concentrate's chain cap, Ultimate Shield's auto-toggle, the HP-state heuristic (kept at the scored cycle: on the hardest fights the player is rarely near full health), the 5-block fang geometry, Lucky Reset, the Colossus Titan clamp and Immortal's revive in the one-shot test.</p>
    <h3>Stages</h3>
    <div class="tablewrap"><table class="t"><thead><tr><th>Stage</th><th>Greed tier</th><th>Gear</th><th>Rolls</th><th>Seals</th><th>Deck</th><th>Cards</th><th>Necklace</th></tr></thead><tbody>
    ${STAGES.map(s => { const g = META.stages[s]; return `<tr><td>${STAGE_LABEL[s]}</td><td class="num">${g.greed_tier}</td><td>${g.rarity}</td><td class="num">${pct(g.roll_quality)} of range</td><td class="num">${g.seals}</td><td>${META.deck_menus && META.deck_menus[s] ? `DeckFAST menu, ${META.deck_menus[s].designs.length} designs (greed +${pct(META.deck_menus[s].greed, 0)})` : esc(g.deck.name)}</td><td class="num">tier ${g.card_tier}</td><td>${g.necklace_legendary ? "legendary (+4)" : "+2"}</td></tr>`; }).join("")}
    </tbody></table></div>
    <h3>Model details</h3>
    ${META.deck_menus ? `<p><b>Decks.</b> Each stage offers a menu of deck designs from the DeckFAST optimizer (Decks view): the best design for each group of builds with similar stat needs, plus the best for all builds, under the reworked core and deck rules. A design fixes each slot's type and colour, the deck's modifiers (Mystery decks inherit theirs at 75%) and its best core sets; the build search picks the design, its core set and the card in every slot, including Knack cards (talent levels), Arcane cards (ability levels) and the Resource and Temporal cards that feed the cores that read them. Each card is worth its listed value times base x (1 + additive cores and modifiers) x multiplicative cores x (1 + greed bonuses); deck multipliers never scale levels. The first half of each restart may switch design (eight greedy card moves adapt the new design before it is judged); the rest of the search, the second phase and the Edge of Time pass keep it. Cards of the removed stats (flat attack damage, flat ability power, lucky hit chance, flat thorns) are never offered. Early stage: at most one Knack, one Temporal and two Deluxe cards. Every deck has the free core socket.</p>` : `<p><b>Decks.</b> Each stage uses a fixed layout from the DeckFAST optimizer, re-run with 0.34.1 rules (0.34.1 already ships the additive Archive core, so the Rook layout scores an NDM of 4352). The search only chooses which evolution or deluxe card sits in each stat slot, using real card values (evolution tier 5: 3 attack damage, 1.3% damage increase, 1% armor). The Anvil's +100% applies only to Defensive cards.</p>`}
    <p><b>Attack rate.</b> Better Combat swings every ceil(0.75 D) + round(0.25 max(D, 2)) ticks, with D = 20 / attack speed: 5 swings/s at attack speed 5, 6.67/s from 7.5 to 15, and the 10/s cap only above 15. Smite Archon fires 10 bolts a second at random entities in range; the boss gets 1 in ${K.smite_targets_in_range}.</p>
    <p><b>Gear.</b> Rolls sit at ${pct(META.stages.early.roll_quality)} of their range early and mid and at the top late, snapped to the game's roll step. Vorpal seals always sit at ${pct(META.stages.max.seal_roll_quality)} of their range (you can't pick the roll, and good seals are hard to hit). Endgame searches both The Rook Deck and The Anvil Deck and keeps whichever scores higher for each build; the Mystery Deck (cake + runic) is reserved for max. Etchings do not stack (the game reads the first copy only), except the two that sum. Each search ends with a pass that sets every affix, card, etching, trinket and charm roll to its best option. Weapon and offhand pictures are the real 3D item models, drawn from their Blockbench cubes.</p>
    <p><b>Search.</b> ${META.engine === "rust" ? "The Rust kernel (kernel/) scores builds with the same formulas as the Python model and re-checks every final build against it." : "The Python model (model/search.py) runs the search."} ${META.p2_top ? `Each build comes from a two-phase search: ${META.restarts} short simulated-annealing runs of ${META.iters} steps, then the best ${META.p2_top} of those are re-annealed for ${META.p2_iters} steps each at a lower temperature, and the best build found anywhere is reported.` : `Each build is the best of ${META.restarts} simulated-annealing runs of ${META.iters} steps.`} A step changes one thing: an affix, implicit, seal, etching, trinket, charm, deck card, talent, ability or ${REWORK ? "god-tree node, god level or transfer slot" : "greed node"}, or it re-rolls the weapon or offhand, or swaps a piece for a unique or back.${META.engine === "rust" ? " Only legal changes that alter the build are proposed, so no step is spent on a rejected draw." : ""} ${META.schedule && META.schedule.kind === "target" ? `The temperature is steered so that the share of worse builds accepted falls from ${pct(META.schedule.a0)} to ${pct(META.schedule.a1)} over the run.` : "The temperature falls geometrically over the run."} A best-option pass over uniques, affixes, unique seals, cards, etchings, trinkets and charm finishes each run, then unused etchings and points are removed.${REWORK ? " In the greed-rework ledger the god trees split the search into basins, so half the restarts are locked: per block of eight, four keep Velara as charm god with Immortal owned, two keep Idona with Ultra Rampaging, and two keep Idona with Grand Archmage (ability builds; melee builds give those to the first two). The other half run free, and the best of all of them is reported." : ""}${META.opts && META.opts.repair ? ` After each god-tree move the gear gets ${META.opts.repair} greedy repair steps, and the god move is judged on the repaired build, so a god change is not rejected just because the gear has not adapted yet.` : ""}${META.opts && META.opts.weights ? " God-tree moves pick target nodes by a measured prior: before each run, every minor and major node is bought on the starting build and its score gain sets how often the search aims at it." : ""}</p>
    <p><b>Baseline for every build.</b> Vein Miner 4, Heal 4 and Dash 8 as learned points; at least ${K.min_mana_regen} mana regen per second and ${pct(K.min_cooldown_reduction)} cooldown reduction. From mid stage on the offhand is locked to a plushie with time-acceleration immunity (knob time_plushie_lock), which hyper vaults currently require. Every build also needs an effect-negation source (Trinkets and movement)${REWORK ? ` and ${pct(kn("min_move_speed"))} stable movement speed` : ""}. High- and low-HP bonuses follow the health state (Survival).</p>
    <p><b>Kills in the fight.</b> The boss fight has adds: one kill every ${fin(kn("kills_per_s")) && K.kills_per_s > 0 ? +(1 / K.kills_per_s).toFixed(2) : "-"} s (knob kills_per_s ${kv("kills_per_s")}; brutal adds, not bosses, which stand in for the summons and waves). Kill-stacking talents share one timer that every new stack resets: with T = duration x (1 + effect duration) x Stack Hoarder (x1.5), the stacks stay at their maximum (Super Stacker, Stack Master, Stack Stack Stack and the Pyramid Scheme etching included) when kills per second x T is at least 1, else one stack at that uptime. Hit-stacking talents (Battle Trance, Frenzy, Lucky Momentum) follow the same rule with the normal-hit rate. Berserk (prestige) holds all 20 stacks when a kill comes at least every 20 s. Ultra Rampaging gains Fury per kill x kills per second from the adds (no boss multiplier).</p>
    <p><b>Concentrate.</b> Each cast strips ${kv("concentrate_effects_stripped")} effects from nearby adds (knob concentrate_effects_stripped; the code excludes hyperbosses), each one becoming Empower with chance 1/5, so a cast brings K = 0.2 x that many Empower procs. The first starts Empower at the tier's base amplifier for min(600, D) ticks, D = base duration x (1 + effect duration); each later one, while the remaining duration is below 600, raises the amplifier by min(chance / (1 + 0.1 amp), 2) and extends the duration to min(600, d + max(1, D (1 - d / 600))). The model steps this chain with procs every cooldown / K, the remaining duration running down between them, ending when it runs out before the next proc or after the stack cap: 10 + floor(ability level / 3) procs in the rework (a proposed Concentrate attribute), 20 procs in 0.34.1 (a model cap; there the game has none and the chain never ends at 80%+ cooldown reduction); the next proc restarts at the base amplifier. Attack damage is x(1 + 0.1 x (average amplifier + 1) x active share), and each build's notes show both numbers. The cast pays its cost after mana-cost reduction (the cast bug modeled as fixed).</p>
    <p><b>Fangs.</b> Hits per cast on the boss come from a quadrature over the boss roster (Golem, Boogieman and Black Widow, 0.9, 1.2 and 1.68 blocks wide, equally likely) with the boss ${kv("fang_boss_distance")} blocks from the player (knob fang_boss_distance), 720 directions (tools/fang_geometry.py, data/fang_hits.json, by AoE-scaled radius). Wall of Fangs rings sit at 1.0, 2.5, 4.0 ... blocks with int(2&pi;d / 1.5) fangs each, centred on the player; Hungry Maw is a line three fangs abreast from 1.5 to 1.5 x radius blocks along the look direction; each fang hits each entity once. The boss stands 5 blocks away by ruling (fang builds fight at ranged distance; it was 3), so a Wall radius under about 4 blocks barely reaches it; from about 7 blocks of radius on, the count stays at 3.25 hits per Wall cast and 8.26 per Maw cast (Maw saturates from 5 blocks), of which Maw keeps x${kv("maw_pull_factor")} after its pull (knob maw_pull_factor, 6.19 at the default).</p>
    <p><b>Vaultarang.</b> The rang family throws one rang at a time: out and back over ${kv("rang_travel_blocks")} blocks (knob rang_travel_blocks) at 1.5 + 0.325 x velocity blocks per tick, then the catch cooldown of round(20 / attack speed) ticks. The outbound hit is a full normal attack (damage increase, the registry, Rampage with Fury, lucky hits and echo; vanilla i-frames, no Better Combat reset) with Concentrate's Empower and Battle Cry; the return hit is a plain hurt of attack damage x (1 + returning damage) inside the outbound hit's i-frames, so only its raw above the outbound raw counts (no lucky hit, echo or crit). Piercing (+1 target per level) and ricochet (+0.5 per level) only add pack targets. The family does not weave, takes no execute, reaving or Starforge nova, and is ranged.</p>
    <p><b>Shields and buff abilities.</b> Ultimate Shield is a toggle that drains min(baseManaDrainPerTick + manaDrainRampPerSecond x seconds on, maxManaDrainPerTick) mana per tick, taken at half the kill time on, paid with the other toggles; when the mana left after the damage abilities cannot pay it, its uptime is the share of the fight a full bar covers. While it is on, a landed hit has percentageDamageAbsorbed of it absorbed at manaPerDamageScalar x ${kv("ultimate_shield_scalar_mult")} mana per point (knob ultimate_shield_scalar_mult) from the bar: a full bar, or with sneak-cast Power Dump half the refill between dumps, in 0.34.1 the shield off for the part of each refill below one tick's drain; in the rework (proposed) it stays on while one tick's regeneration covers one tick's drain, so only a build whose regeneration falls short loses that part. The window then absorbs uptime x min(k<sub>q</sub> x share x hit, bar / mana per point); each build's notes give the drain, the absorption per hit and the uptime. Mana Shield adds its healthPoints x uptime (its duration unscaled, as the ability applies it) to the window's pool, never to the one-shot test. Totem (Rejuvenation) heals totemHealthPerSecond x its uptime. Empower adds its speed to stable speed only when paid in full; Slowness Aura puts Slowness on a melee-range boss (uptime 1, 0 for a ranged build); Sneaky Getaway adds the Ninja etching's dodge inside the 95% cap and its speed at its uptime duration / (duration + cooldown). Necromancy's Golem hits for ability power x its percentage x its stacks per swing, souls assumed built.</p>
    <p><b>The Dice.</b> Each hit rolls U(0.01, 3.0) (mean 1.505, coefficient of variation 0.573). A slow-hitting build's kill time swings with its rolls, so The Dice counts at the ${pct(kn("dice_percentile"))} point of the kill (knob dice_percentile; 50% is the plain mean): mean x max(1 / mean, 1 - z x 0.573 / &radic;n), z the normal quantile and n the fight's damage-weighted hit count, DPS&sup2; / &Sigma; (dps<sub>i</sub>&sup2; / rate<sub>i</sub>) over every scored source x kill time x shield uptime. With the defaults that costs about 3% at 10 hits per second and 11% at one.</p>
    <p><b>Damage over time.</b> Poison Nova and Toxic Grenade are the only ability-power DoTs: the cast fixes the total (ability power x its percentage) and deals it over D = floor(20 x duration x (1 + effect duration)) ticks as floor(D / 20) one-second hits of total x 20 / D. A cast of either wipes every DoT on the target, so with both in a rotation casts arrive at a = &Sigma; share / period and each keeps min(D, 1 / a) of its duration. Poison from effect clouds (5% weapon clouds, Poison III to XVII) is the vaults' poison override: amplifier + 1 damage per second, unscaled. A cloud triggers at min(1, min(1, chance) + additive chance) per qualifying hit with no Luck, lasts floor(duration x (1 + effect duration)) ticks after a 20-tick wait, and is up 1 - e<sup>-rate x (ticks + 20) / 20</sup>; the "cloud poison" row deals the sum of those uptimes at the strongest amplifier + 1. That is at most 17 per second before multipliers (about 100 DPS at the early stage), noise against the boss's health: a DoT-cloud build cannot compete without a scaling change. Wither clouds and trails deal nothing the player is credited with (0). Which multipliers each kind takes:</p>
    <div class="tablewrap"><table class="t"><thead><tr><th>Multiplier</th><th>Poison Nova / Toxic Grenade tick</th><th>Cloud poison</th><th>Cloud wither</th></tr></thead><tbody>
      ${[["Damage increase", "no", "no", "no (not player-sourced)"], ["Normal multiplier registry (Rampage, Totem, Berserk, Relentless, Third Attack)", "no", "no", "no"], ...(REWORK ? [["Berserking and Depleted (global in this ledger, proposed)", "yes", "yes", "no"]] : []), ["Ability-power multipliers (AP Totem, Power Dump, the addon's AP multipliers)", "yes", "yes", "no"], ["God global registry (Edge of Time, Immortal, Speed Demon, Paced Strikes, Under Pressure, Banked Anger, Kinetic Impact, Unstoppable Greed, Surrounded)", "no (skips DoT)", "yes", "no"], ["Sneaky Advantage, Greedbane, Prison Warden", "no", "yes", "no"], ["Pincushion, Weaponmaster, True Rage, Cleave Expert", "no", "no", "no"], ["Vulnerable", "yes", "yes", "yes"], ["Hexbreaker (ability-power hits only)", "no (ticks carry no AP flag)", "yes", "no"], ["Executioner, The Dice, hyper Frenzy", "yes", "yes", "no"], ["Lucky hits, echo, cloud procs, i-frame clip, double hit", "no", "no", "no"], ["Poison Mana etching", "yes (per tick)", "yes (per hit)", "no"]].map(r => `<tr><td>${esc(r[0])}</td>${r.slice(1).map(x => `<td>${esc(x)}</td>`).join("")}</tr>`).join("")}
    </tbody></table></div>
    <p><b>Executioner.</b> x(1 + bonus) on every hit, ability power included, once the target is below 50% HP (LivingDamage, LOWEST priority). Averaged over a kill it is worth 1 / (0.5 + 0.5 / (1 + bonus)), x1.23 at rank 3.</p>
    <p><b>Rampage Berserker.</b> With ${K.rampage_refresh_regen}+ mana regen per second and ${pct(K.rampage_refresh_cdr)} cooldown reduction it is refreshed on cooldown at ${pct(K.rampage_refresh_uptime)} uptime.</p>
    <h3>Hyperboss by cycle</h3>
    <p>Health is ${num(META.hyper.ref_health)} x (1.5 + ${META.hyper.health_percent} x ${META.hyper.stat_factor}<sup>c</sup> + ${META.hyper.increment}c), damage per hit ${num(META.hyper.ref_damage)} x (1 + ${META.hyper.damage_percent} x ${META.hyper.stat_factor}<sup>c</sup> + ${META.hyper.increment}c) (HyperBossManager, solo). Below cycle 0 that formula's linear term drives health and damage to zero near cycle -1.5, so there the model extends both geometrically from cycle 0 (x${META.hyper.stat_factor} per cycle): negative cycles are an extrapolation that keeps weak builds ordered. On top of that the boss inherits the vault's chaos modifiers. As shipped, all of this is an attack-damage attribute modifier and the_vault caps attack damage at 1,000,000 (ModAttributes:47), so the boss's attack damage stops at 1M around cycle 4 (bug BOSS-DMG-CAP). Per-attack multipliers still sit on top (golem double hand x4, ground slam x3, boogieman slash x1.5) along with mob crits (x1.5-2.0 on the rune bosses).</p>
    <p><b>Boss hit used for survival.</b> Every hit counts as a crit at x${META.knobs.hyper_boss_crit_mult} before crit mitigation (Hit size). The table's last column is the expected crit chance that assumption stands for: the roster's own chance (Golem 0, Boogieman 0.10, Black Widow 0.50) plus about 0.29 per 25-draw chaos dump from the hyper pool (Critical, Abusive, Spicy Chili, Lethal), c + 1 dumps at cycle c, clamped at 1 per boss and averaged over the roster. Bugs fixed: attack damage x ${META.knobs.hyper_boss_crit_mult}. As shipped: the larger of the real capped crit hit (${META.knobs.hyper_boss_crit_mult} x min(attack damage, 1M)) and a deliberately generous ramp of 1M x 2<sup>c - ${META.knobs.hyper_cap_ramp_start}</sup>, levelling off at ${num(META.knobs.hyper_cap_plateau)} (golem double hand x4 with a x1.8 crit, the worst documented hit), and never above the uncapped hit (user ruling: better over-beefed than on the cusp). Player-side chaos effects, such as stripped resistance, are still not modeled.</p>
    <p><b>Chaos modifiers.</b> A hyper vault draws ${META.knobs.hyper_chaos_modifiers ? "" : "(switched off in this run) "}25 chaos modifiers when it opens and 25 after every boss kill. It draws one from the all-bad pool for every Infernal mod on every Brutal Pillar boss, and one per runner every 2 minutes. All of these share a budget of 350. The 350 budget fills around cycle 6. Every mob-health modifier in these pools is additive, and HyperBossManager folds their sum into the boss's health when the fight is armed, so the boss carries about x15 health once the budget is full. Damage modifiers add to the boss's ${META.hyper.damage_percent} x ${META.hyper.stat_factor}<sup>c</sup> damage term and barely matter past cycle 2. Frenzy (${META.knobs.hyper_frenzy ? "counted" : "switched off"}) multiplies every player hit by 1 + 2 x stacks; its stacks are capped at 1 + (cycle - 1) / 4. Factors are log-averages over 4000 simulated solo vaults at ${META.knobs.hyper_minutes_per_cycle} minutes per cycle (p10-p90 in brackets).</p>
    <p><b>Not modeled yet.</b> The same pools also strip about 320% resistance from the player once the budget is full. That is applied before the cap, and resistance clamps at 0, so almost every build fights at 0 resistance. They also stack about +500% mob crit chance, add Mana Leak in about 3 of 4 vaults from cycle 3, and add Inert (-10% cooldown reduction every second kill). These make deep-cycle survival and mana weaker than shown here.</p>
    ${chart([["health", "#fb923c", "boss health with chaos modifiers", false], ["health_base", "#7d7c8c", "without chaos modifiers", true]], 7, 16, "Boss health by cycle")}
    ${chart([["damage", "#60a5fa", "boss damage per hit", false]], 4, 12, "Boss damage per hit by cycle")}
    <div class="tablewrap"><table class="t"><thead><tr><th>Cycle</th><th>Chaos modifiers</th><th>Boss HP factor</th><th>Boss HP</th><th>Without chaos</th><th>Attack damage</th><th>Hit, bugs fixed (crit)</th><th>Hit, as shipped</th><th>Frenzy (vaults with it)</th><th>Boss crit chance (expected)</th></tr></thead><tbody>${bossRows}</tbody></table></div>
    <h3>Assumptions you can change</h3>
    <div class="tablewrap"><table class="t"><tbody>${Object.entries(K).map(([k, v]) => `<tr><td>${esc(k)}</td><td class="num">${esc(v)}</td></tr>`).join("")}</tbody></table></div>
    <h3>Bugs the switch covers</h3>
    <div class="tablewrap"><table class="t"><tbody>${Object.entries(META.bugs).map(([k, x]) => `<tr><td><b>${esc(x.title)}</b> <span style="color:var(--muted)">${esc(k)}</span><br><span style="font-size:.8rem">${esc(x.what)} ${esc(x.why)}</span></td></tr>`).join("")}</tbody></table></div>
    <h3>Fallbacks hit during the run</h3>
    ${fb.length ? `<ul class="notes">${fb.map(([k, v]) => `<li><b>${esc(k)}</b> (${v.count}x): ${esc(v.message)}</li>`).join("")}</ul>` : "<p>None.</p>"}
    <p style="font-size:.8rem;color:var(--muted)">Generated ${esc(META.generated)} · ${META.p2_top ? `${META.restarts} x ${META.iters} + ${META.p2_top} x ${META.p2_iters} annealing steps per build` : `${META.iters} annealing steps x ${META.restarts} restarts per build`} · ${BUILDS.length} builds.</p>
  </div></section>`;
}

function render() {
  hideTip(true);
  renderControls();
  if (S.view === "progression") renderProgression();
  else if (S.view === "nodes" && REWORK) renderNodes();
  else if (S.view === "gear" && REWORK) renderGear();
  else if (S.view === "etchings" && REWORK) renderEtchings();
  else if (S.view === "decks" && REWORK) renderDecks();
  else if (S.view === "method") renderMethod();
  else renderLedger();
}
render();
window.addEventListener("resize", () => { const b = document.querySelector(".bench"); if (b) drawWires(b); });
</script>
